{% extends 'base.html' %}

{% block content %}

<h1>Registrar Alumno</h1>

<div class="card card-registro">
    <p class="form-description">Registra al alumno y asigna el plan con el pago inicial.</p>

    <form action="{{ url_for('alumnos.guardar') }}" method="POST" class="form-registro">
        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
        </div>

        <div class="form-row">
            <div class="form-group form-group-half">
                <label for="edad">Edad</label>
                <input type="number" id="edad" name="edad" placeholder="Ej. 14" required>
            </div>

            <div class="form-group form-group-half">
                <label for="telefono">Teléfono</label>
                <input type="text" id="telefono" name="telefono" placeholder="Ej. 71234567" required>
            </div>
        </div>

        <div class="form-group">
            <label for="fecha_inscripcion">Fecha de inscripción</label>
            <input type="date" id="fecha_inscripcion" name="fecha_inscripcion" value="{{ hoy }}" required>
            <small>La mensualidad vence un mes después de la fecha de inscripción, manteniendo el mismo día.</small>
        </div>

        <div class="form-group">
            <label for="categoria">Categoría</label>
            <select id="categoria" name="categoria" required>
                <option value="">Selecciona una categoría</option>
                {% for cat in categorias %}
                <option value="{{ cat.nombre }}">{{ cat.nombre }} · {{ cat.rango }} · {{ cat.horario }} · {{ cat.dias }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-row">
            <div class="form-group form-group-half">
                <label for="nombre_padre">Nombre del padre/tutor</label>
                <input type="text" id="nombre_padre" name="nombre_padre" placeholder="Ej. Carlos Pérez">
            </div>

            <div class="form-group form-group-half">
                <label for="telefono_padre">Teléfono del padre/tutor</label>
                <input type="text" id="telefono_padre" name="telefono_padre" placeholder="Ej. 71234567">
            </div>
        </div>

        <div class="form-group">
            <label>Plan</label>
            <div class="plan-options">
                <label class="radio-card" for="plan_normal">
                    <input type="radio" name="plan" value="normal" id="plan_normal">
                    <div>
                        <strong>Plan Normal</strong>
                        <small>180 bs</small>
                    </div>
                </label>

                <label class="radio-card" for="plan_especial">
                    <input type="radio" name="plan" value="especial" id="plan_especial">
                    <div>
                        <strong>Plan Especial</strong>
                        <small>Monto personalizado</small>
                    </div>
                </label>
            </div>
        </div>

        <div class="form-group">
            <label for="monto">Monto de pago</label>
            <input type="number" name="monto" id="monto" placeholder="Monto en bs" step="0.01" disabled>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Guardar</button>
    </form>
</div>

<script src="{{ url_for('static', filename='js/nuevo_alumno.js') }}"></script>

{% endblock %}
