{% extends 'base.html' %}

{% block content %}

<h1>Registrar Pago</h1>

<div class="card card-registro" style="max-width: 560px; margin: auto;">
    <p class="form-description">Busca al alumno y selecciona el mes con el control de calendario.</p>

    <form action="{{ url_for('pagos.guardar_pago') }}" method="POST" class="form-registro">
        <div class="form-group">
            <label for="buscador">Buscar alumno</label>
            <input type="text" id="buscador" placeholder="Ej. Juan Pérez">
            <div id="resultados" class="resultados"></div>
        </div>

        <input type="hidden" name="alumno_id" id="alumno_id">

        <div class="form-row">
            <div class="form-group">
                <label for="mes">Mes</label>
                <input type="month" id="mes" name="mes" value="{{ mes_actual }}" required>
            </div>

            <div class="form-group">
                <label for="monto">Monto</label>
                <input type="number" id="monto" name="monto" placeholder="Monto en bs" step="0.01" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Guardar Pago</button>
    </form>
</div>

<script id="alumnos-data" type="application/json">
{{ alumnos | tojson }}
</script>

<script src="{{ url_for('static', filename='js/buscador.js') }}"></script>

{% endblock %}
