services:
  - type: web
    name: sistema-futbol-club
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: futbol-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: futbol-db
    plan: free
    databaseName: futbol
